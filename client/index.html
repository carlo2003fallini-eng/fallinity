<!doctype html>
<html lang="it">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Fallinity — Enterprise Operating System</title>
    <meta name="description" content="Fallinity FEOS — il sistema operativo per la gestione integrata dell'azienda agricola: finanza, stalla, campi, magazzino, officina e reintegrazione." />
    <meta name="theme-color" content="#0a0f0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fallinity" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/manus-storage/fallinity-app-icon-192_3ee5c98d.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/manus-storage/fallinity-apple-touch-icon_95fb98f5.png" />
    <link rel="preload" as="image" href="/manus-storage/fallinity-app-icon-192_3ee5c98d.png" fetchpriority="high" />
    <style>
      #fallinity-static-splash{position:fixed;inset:0;z-index:9999;display:grid;min-height:100dvh;place-items:center;background:radial-gradient(circle at 50% 40%,#15351f 0,transparent 54%),#070b08;color:#f2f5f2;font-family:Inter,system-ui,sans-serif;text-align:center}#fallinity-static-splash img{width:112px;height:112px;border-radius:28px;box-shadow:0 24px 64px rgba(0,0,0,.52),0 0 38px rgba(68,194,91,.18)}#fallinity-static-splash strong{display:block;margin-top:22px;font-size:28px;letter-spacing:.17em}#fallinity-static-splash span{display:block;margin-top:9px;color:#d3a44d;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}#fallinity-static-splash small{display:block;margin-top:28px;color:#8e9b90;font-size:12px}#fallinity-static-splash button{margin-top:18px;border:1px solid rgba(74,222,128,.35);border-radius:12px;background:#45c75a;color:#071108;font:600 14px Inter,system-ui;padding:12px 24px}@media(display-mode:standalone){#fallinity-static-splash{display:none!important}}
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root" aria-busy="true">
      <div id="fallinity-static-splash" role="status" aria-label="Avvio di Fallinity">
        <div>
          <img src="/manus-storage/fallinity-app-icon-192_3ee5c98d.png" alt="" width="112" height="112" />
          <strong>FALLINITY</strong>
          <span>Enterprise Operating System</span>
          <small id="fallinity-static-status">Preparazione ambiente di lavoro</small>
        </div>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true) return;
        var splash = document.getElementById("fallinity-static-splash");
        var status = document.getElementById("fallinity-static-status");
        if (!splash || document.documentElement.dataset.appReady === "true") return;
        if (status) status.textContent = "Avvio non completato. Controlla la connessione e riprova.";
        var retry = document.createElement("button");
        retry.type = "button";
        retry.textContent = "Riprova";
        retry.onclick = function () { window.location.reload(); };
        splash.querySelector("div")?.appendChild(retry);
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
